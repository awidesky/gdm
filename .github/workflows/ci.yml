name: ci

# gdm is an OpenGL dependency manager, so this workflow checks that one thing:
# that gdm resolves each dependency through every tier it has, and that whatever
# it resolved builds and links. Two jobs per OS, no build artifacts required from
# anywhere:
#
#   fetch     - nothing preinstalled: gdm must download and build glfw/freeglut/
#               glm/glew-cmake/cpptrace from source and generate glad. This is
#               the path every fresh user takes, so it runs on all three OSes.
#   installed  - everything the system package manager provides (apt / Homebrew /
#               vcpkg, versions and GLEW's variant taken from the probe): gdm must
#               find it with find_package instead of downloading, and a download
#               fails the job. The one exception, because nothing packages it for
#               a distro: the header-only stb_image / tiny_obj_loader / dds-ktx,
#               which glutil fetches itself. cpptrace is NOT an exception: it is
#               packaged everywhere this job runs (see the notes in the installed
#               job), and where it is not, the job must say so by failing.
#
# The examples never run unattended: they open a window and loop until it is
# closed. What CI can prove is that configuring succeeded, every target linked
# and every executable exists; package.py then stages the binaries with their
# assets, so the result can be run on a real machine (README.txt in the payload
# explains what that machine needs).

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned where a version drift would only churn the artifact; freeglut is
  # deliberately left to gdm, because resolving its version is itself part of
  # what this workflow checks (freeglut tags v3.8.0 -> gdm picks 3.8, whose
  # native Cocoa backend is the one macOS can build; 3.4 needs X11 and macOS
  # ships no GLX headers). GLEW is unpinned in the fetch job on purpose: with
  # "installed" and nothing installed, gdm reads Perlmint/glew-cmake's tags
  # feed and derives both version and git tag from it.
  GDM_GLFW_VERSION: "3.5.1"
  GDM_GLM_VERSION: "1.0.3"
  GDM_CPPTRACE_VERSION: "1.0.4"

jobs:
  fetch:
    name: fetch and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # "installed": nothing is installed here, so gdm cannot find a system GLEW
      # and must resolve the newest glew-cmake tag from Perlmint/glew-cmake.
      GDM_GLEW_VERSION: "installed"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # package.py stages the artifact payload.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # glfw compiles its X11 and Wayland backends on Linux, so those dev headers
      # are needed to build it; xvfb and Mesa provide the software GL the example
      # run at the end of this job uses.
      - name: system OpenGL/X11 dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
            libwayland-dev libxkbcommon-dev xvfb
      - name: start a display
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1024x768x24 >/dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      # Nothing is installed on this runner, on purpose: the runner's macOS image
      # provides no OpenGL development packages (no glfw/glm/cpptrace/glew), so
      # every dependency is downloaded and built from source - which is what this
      # job exists to check. ogl-gdm's CI does the same thing with the same loader
      # (glew-glad) and installs nothing here either.

      # steps below: "build" (blocking on every OS) and "run the example" (only
      # where the runner can create an OpenGL context - see those steps)

      # windows-latest is the Windows Server 2025 image, which ships only Visual
      # Studio 2026, and VS2026 needs CMake >= 4.1. Resolve the installed toolset
      # instead of hardcoding a version that may not exist.
      - name: resolve Visual Studio generator
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $tools = 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64'
          $installPath = & $vswhere -latest -products * -requires $tools -property installationPath
          if (-not $installPath) { throw "No Visual Studio with the VC++ x64 toolset found" }
          $vsVersion = & $vswhere -latest -products * -requires $tools -property installationVersion
          $major = [int]($vsVersion.Split('.')[0])
          $generator = @{ 16 = 'Visual Studio 16 2019'; 17 = 'Visual Studio 17 2022'; 18 = 'Visual Studio 18 2026' }[$major]
          if (-not $generator) { throw "Unsupported Visual Studio major version $major ($vsVersion)" }
          $cmakeVersion = ((cmake --version | Select-Object -First 1) -replace '^cmake version ','')
          Write-Host "Visual Studio $vsVersion at $installPath -> -G $generator (CMake $cmakeVersion)"
          if ($major -ge 18 -and ([version]$cmakeVersion -lt [version]'4.1')) {
            throw "Visual Studio 18 2026 needs CMake >= 4.1, found $cmakeVersion"
          }
          "VS_GENERATOR=$generator" | Out-File -FilePath $env:GITHUB_ENV -Append

      # The windows runner has no OpenGL driver at all ("WGL: The driver does not
      # appear to support OpenGL"), so the example could never run here. Mesa's
      # llvmpipe provides a software WGL implementation (certified OpenGL 4.5):
      # its opengl32.dll + libgallium_wgl.dll are loaded per-application when they
      # sit next to the executable, which gdm_run already arranges (it copies every
      # *.dll from the build dir, from $PREFIX/bin and from $MESA_DLL_DIR).
      # Version is pinned on purpose: the 26.2.6 msvc release archive is currently
      # missing its OpenGL bundle (pal1000/mesa-dist-win#249), so 26.2.5 is the
      # newest verified one. GALLIUM_DRIVER=llvmpipe selects the software
      # rasterizer explicitly instead of probing for hardware first.
      - name: Mesa llvmpipe (software OpenGL, Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "26.2.5"
          $archive = "$env:RUNNER_TEMP\mesa3d-$version-release-msvc.7z"
          Invoke-WebRequest "https://github.com/pal1000/mesa-dist-win/releases/download/$version/mesa3d-$version-release-msvc.7z" -OutFile $archive
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) { $sevenZip = "7z" }
          & $sevenZip x $archive -o"$env:RUNNER_TEMP\mesa" -y | Out-Null
          if (-not (Test-Path "$env:RUNNER_TEMP\mesa\x64\opengl32.dll")) {
            throw "Mesa archive did not contain x64/opengl32.dll - check the pinned version"
          }
          "MESA_DLL_DIR=$env:RUNNER_TEMP\mesa\x64" | Out-File -FilePath $env:GITHUB_ENV -Append
          "GALLIUM_DRIVER=llvmpipe" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Mesa llvmpipe staged in $env:RUNNER_TEMP\mesa\x64"

      # Nothing is installed and external/ is empty, so every dependency is
      # fetched: gdm's download tier, and glad generated on the fly.
      # cpptrace cloning libdwarf-lite at configure time, 
      # the installed job is where the system libdwarf is used instead.
      # This build also carries the warning flags, and it is what the Debug
      # payload ships.
      - name: "1 · default (glfw + glad + glm) · Debug · download tier"
        shell: bash
        run: |
          source .github/scripts/ci-common.sh
          gdm_configure b-dbg Debug -DCMAKE_CXX_FLAGS="$WARN_FLAGS"
          gdm_build b-dbg Debug
          gdm_require cfg-b-dbg.log "\[GDM\] Fetching glfw3" "glfw was fetched"
          gdm_require cfg-b-dbg.log "\[GDM\] Fetching cpptrace" "cpptrace was fetched"
          gdm_collect_warnings build-b-dbg.log

      # Same external/ directory, so gdm's first tier wins and nothing is
      # downloaded again - and the download itself never has to be repeated.
      - name: "2 · default · Release · external directory tier"
        shell: bash
        run: |
          source .github/scripts/ci-common.sh
          gdm_configure b-rel Release
          gdm_build b-rel Release
          gdm_require cfg-b-rel.log "\[GDM\] Found external glfw3" "the fetched sources were reused"
          gdm_forbid cfg-b-rel.log "Fetching" "nothing was downloaded a second time"

      # A different window backend and loader, sharing the same external/
      # directory: freeglut and glew-cmake are fetched next to the already
      # downloaded glm/cpptrace, which proves the version-keyed layout coexists.
      # This config is also warning-checked: it compiles gdm's own code that
      # step 1 does not (the example's freeglut path), so it carries the warning
      # flags too and its log is collected as well.
      # gdm switches freeglut's macOS build to its native Cocoa backend, because
      # the X11 one needs GLX headers macOS does not ship.
      - name: "3 · freeglut + glew · Debug · build and run the example"
        shell: bash
        run: |
          source .github/scripts/ci-common.sh
          gdm_configure b-fg Debug -DCMAKE_CXX_FLAGS="$WARN_FLAGS" -DGDM_WINDOW_BACKEND=freeglut -DGDM_GL_LOADER=glew
          gdm_require cfg-b-fg.log "\[GDM\] Fetching freeglut" "freeglut was fetched"
          gdm_require cfg-b-fg.log "\[GDM\] Fetching glew-cmake" "glew-cmake was fetched (version resolved from its tags)"
          gdm_require cfg-b-fg.log "\[GDM\] Found external glm" "glm was reused from external/"
          gdm_build b-fg Debug gdm_example_1_HelloWindow
          gdm_collect_warnings build-b-fg.log
          # An attempted run that fails fails the job. It is attempted on Linux and
          # Windows: Linux has Xvfb + Mesa llvmpipe, and the "Mesa llvmpipe" step
          # above gives the Windows runner a software WGL driver. The macOS runners
          # cannot create a context at all (NSGL requires an accelerated renderer
          # and Apple's software renderer is 2.1 compat), so macOS stays build+link.
          gdm_run_example b-fg

      # The hybrid loader: glew-cmake plus glad with every extension, the
      # generated GL/glew.h wrapper and the glewToGlad bridge. The bridge is
      # gdm's own source, so this build carries the warning flags as well.
      - name: "4 · glew-glad · Debug · run the example"
        shell: bash
        run: |
          source .github/scripts/ci-common.sh
          gdm_configure b-gw Debug -DCMAKE_CXX_FLAGS="$WARN_FLAGS" -DGDM_GL_LOADER=glew-glad
          # step 3 already downloaded glew-cmake (its version resolved from its own
          # tags), so here it is reused - which is what proves the two providers
          # share the version-keyed external directory
          gdm_require cfg-b-gw.log "\[GDM\] Found external glew-cmake" "glew-cmake was reused from external/"
          gdm_require cfg-b-gw.log "\[GDM\] Found external glm" "glm was reused from external/"
          gdm_build b-gw Debug gdm_example_1_HelloWindow
          gdm_collect_warnings build-b-gw.log
          gdm_run_example b-gw

      # Verifies that every target of the default build produced an executable
      # and stages them with their assets; the Debug payload keeps symbols, the
      # Release payload is stripped.
      - name: package
        shell: bash
        run: |
          payload="${{ runner.temp }}/payload"
          cfg=""
          if [ "$RUNNER_OS" = "Windows" ]; then cfg="--config Debug"; fi
          python .github/scripts/package.py --build-dir b-dbg $cfg --no-strip \
            --payload-dir "$payload/gdm-examples-${{ runner.os }}-Debug"
          cfg=""
          if [ "$RUNNER_OS" = "Windows" ]; then cfg="--config Release"; fi
          python .github/scripts/package.py --build-dir b-rel $cfg \
            --payload-dir "$payload/gdm-examples-${{ runner.os }}-Release"

      # upload-artifact always zips what it is handed, so hand it the unpacked
      # payload: the download then expands straight into the executables and
      # assets instead of into another archive.
      - uses: actions/upload-artifact@v7
        with:
          name: gdm-examples-${{ runner.os }}-Debug
          path: ${{ runner.temp }}/payload/gdm-examples-${{ runner.os }}-Debug
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: gdm-examples-${{ runner.os }}-Release
          path: ${{ runner.temp }}/payload/gdm-examples-${{ runner.os }}-Release
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: gdm-warnings-${{ runner.os }}
          path: warnings.txt
          retention-days: 14
          if-no-files-found: ignore

  installed:
    name: installed dependencies (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Ubuntu 26.04 ("resolute") is the newest Ubuntu image GitHub hosts (only
    # 26.04 / 24.04 exist - there is no ubuntu-26.10 and none is scheduled;
    # The cpptrace package only exists from Ubuntu 26.10 ("stonking") on,
    # So libcpptrace-dev is not installable here and cpptrace comes from vcpkg instead
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: resolve Visual Studio generator
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $tools = 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64'
          $installPath = & $vswhere -latest -products * -requires $tools -property installationPath
          if (-not $installPath) { throw "No Visual Studio with the VC++ x64 toolset found" }
          $vsVersion = & $vswhere -latest -products * -requires $tools -property installationVersion
          $major = [int]($vsVersion.Split('.')[0])
          $generator = @{ 16 = 'Visual Studio 16 2019'; 17 = 'Visual Studio 17 2022'; 18 = 'Visual Studio 18 2026' }[$major]
          if (-not $generator) { throw "Unsupported Visual Studio major version $major ($vsVersion)" }
          $cmakeVersion = ((cmake --version | Select-Object -First 1) -replace '^cmake version ','')
          if ($major -ge 18 -and ([version]$cmakeVersion -lt [version]'4.1')) {
            throw "Visual Studio 18 2026 needs CMake >= 4.1, found $cmakeVersion"
          }
          "VS_GENERATOR=$generator" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: install dependencies (linux)
        if: runner.os == 'Linux'
        run: |
          # Everything this platform packages: glfw3, glm, glew (which gdm's
          # default prefers over building glew-cmake), libdwarf + zstd, and the
          # X11 client/GL headers, because glew-cmake - the fallback when the
          # installed GLEW cannot be used - does find_package(X11 REQUIRED) and
          # links X11::X11/Xext; a missing libxext-dev is what "Target libglew_static
          # links to X11::Xext but the target was not found" means.
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
            libglfw3-dev libglm-dev libglew-dev libdwarf-dev libzstd-dev pkg-config \
            mesa-utils libgl1-mesa-dri xvfb
          # cpptrace is the one dependency this distro does not ship: Ubuntu only
          # has libcpptrace-dev from 26.10 on (packages.ubuntu.com: stonking and
          # tenacious, 1.0.4-2), and 26.04 - the newest Ubuntu image GitHub hosts -
          # predates Debian's first upload (2026-03-13). Take it from vcpkg, the
          # same package manager the windows entry of this matrix uses, so the job
          # stays "everything from a package manager" and the gate above (no
          # "[GDM] Fetching" in the configure log) holds. vcpkg's cpptrace is
          # prebuilt with its own libdwarf/zstd, so there is no source build and no
          # libdwarf-lite clone here either.
          vcpkg_triplet="x64-linux"
          vcpkg_bin="$VCPKG_INSTALLATION_ROOT/vcpkg"
          [ -x "$vcpkg_bin" ] || vcpkg_bin="vcpkg" # the image ships a prebuilt copy
          "$vcpkg_bin" install "cpptrace:${vcpkg_triplet}"
          # PREFIX only adds vcpkg's install root to the search path: the apt
          # packages above are still found through the system prefixes, and vcpkg
          # provides cpptrace alone, so nothing is installed twice and vcpkg can
          # never shadow an apt package the probe and the build should use.
          echo "PREFIX=$VCPKG_INSTALLATION_ROOT/installed/${vcpkg_triplet}" >> "$GITHUB_ENV"
          echo "CPPTRACE_ARGS=" >> "$GITHUB_ENV"
          Xvfb :99 -screen 0 1024x768x24 >/dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: install dependencies (macos)
        if: runner.os == 'macOS'
        run: |
          # glew too: gdm's default prefers the system GLEW, and the probe sets
          # GDM_GLEW_STATIC to the variant Homebrew actually defines.
          # Homebrew's cpptrace is prebuilt and bundles its libdwarf, so nothing
          # else is needed for it.
          brew install glfw glm glew cpptrace
          echo "PREFIX=/opt/homebrew" >> "$GITHUB_ENV"
          echo "CPPTRACE_ARGS=" >> "$GITHUB_ENV"

      - name: install dependencies (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # glew too: vcpkg defines GLEW::GLEW and no static variant, so the
          # probe answers GDM_GLEW_STATIC=OFF and the shared target is used.
          # vcpkg's cpptrace is prebuilt and bundles its libdwarf, so nothing
          # else is needed for it.
          vcpkg install glfw3:x64-windows glew:x64-windows glm:x64-windows cpptrace:x64-windows
          echo "PREFIX=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CPPTRACE_ARGS=" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Same reason as the fetch job's step of the same name, and needed for the
      # same reason: the example in this job links shared vcpkg GLEW/glfw DLLs,
      # so without a software OpenGL driver the "run the example" step below
      # could never pass. gdm_run stages $PREFIX/bin and $MESA_DLL_DIR next to
      # the executable, which is exactly the shared-package path this job wants
      # to exercise.
      - name: Mesa llvmpipe (software OpenGL, Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "26.2.5"
          $archive = "$env:RUNNER_TEMP\mesa3d-$version-release-msvc.7z"
          Invoke-WebRequest "https://github.com/pal1000/mesa-dist-win/releases/download/$version/mesa3d-$version-release-msvc.7z" -OutFile $archive
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) { $sevenZip = "7z" }
          & $sevenZip x $archive -o"$env:RUNNER_TEMP\mesa" -y | Out-Null
          if (-not (Test-Path "$env:RUNNER_TEMP\mesa\x64\opengl32.dll")) {
            throw "Mesa archive did not contain x64/opengl32.dll - check the pinned version"
          }
          "MESA_DLL_DIR=$env:RUNNER_TEMP\mesa\x64" | Out-File -FilePath $env:GITHUB_ENV -Append
          "GALLIUM_DRIVER=llvmpipe" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Mesa llvmpipe staged in $env:RUNNER_TEMP\mesa\x64"

      # gdm only uses an installed package when its version matches exactly, so
      # ask the packages themselves what they are and pin gdm to that. The probe
      # fails when a package ships no usable CMake config.
      - name: probe the installed versions
        shell: bash
        run: |
          # Release, because get_target_property(<imported target> LOCATION)
          # resolves to nothing without a build type - and that is the only way
          # the probe can read a GLEW version out of the library name
          # (libGLEW.so.2.2.0, libGLEW.2.3.1.dylib).
          if ! probe=$(cmake -S .github/scripts/probe -B "${{ runner.temp }}/probe" \
                               -DCMAKE_PREFIX_PATH="$PREFIX" \
                               -DCMAKE_BUILD_TYPE=Release 2>&1); then
            echo "$probe" >&2
            echo "FAILED: the probe could not resolve the installed packages" >&2
            exit 1
          fi
          echo "$probe"
          # message(STATUS) prefixes every line with "-- ", so match on a suffix.
          while IFS='|' read -r tag var value; do
            case "$tag" in
              *GDM_PROBE)
                if [ -n "$value" ]; then
                  echo "$var=$value" >> "$GITHUB_ENV"
                fi
                ;;
            esac
          done <<< "$probe"
          # A usable target is what gdm needs: a version file is not, because gdm
          # links the target the config provides.
          for required in GDM_GLFW_TARGET GDM_GLM_TARGET; do
            echo "$probe" | grep -q "GDM_PROBE|$required|." \
              || { echo "FAILED: $required was not installed (probe printed nothing)" >&2; exit 1; }
          done

      # Everything the platform packages comes from the archive (glfw, glm,
      # cpptrace and - with gdm's default GDM_GLEW_VERSION="installed" - GLEW)
      - name: configure and build through find_package
        shell: bash
        run: |
          source .github/scripts/ci-common.sh
          # cpptrace is built from source here, and this is the only way it uses
          # the system libdwarf instead of cloning libdwarf-lite (its default).
          gdm_configure b-inst Release -DGDM_GL_LOADER=glew $CPPTRACE_ARGS
          gdm_require cfg-b-inst.log "\[GDM\] Found installed glfw3" "glfw came from the package"
          gdm_require cfg-b-inst.log "\[GDM\] Found installed glm" "glm came from the package"
          gdm_forbid cfg-b-inst.log "\[GDM\] Fetching glfw3" "glfw was not downloaded"
          gdm_forbid cfg-b-inst.log "\[GDM\] Fetching glm" "glm was not downloaded"
          gdm_forbid cfg-b-inst.log "Cloning into" "nothing was cloned at configure time"
          # Either outcome is correct here: "installed" prefers the system package,
          # and falls back to the latest glew-cmake with a warning. Both are
          # gdm working as documented; what would be wrong is a surprise.
          # gdm is left at its default (GDM_GLEW_VERSION="installed"), so the
          # system package must be used - the variant comes from GDM_GLEW_STATIC,
          # which the probe set to whatever this package actually defines: no
          # static variant anywhere (Homebrew, Ubuntu and vcpkg all define a
          # shared GLEW::GLEW only), so it is always OFF here. Building
          # glew-cmake here instead would mean the package failed to be found,
          # which is a defect this job exists to catch, not a fallback to shrug at.
          gdm_require cfg-b-inst.log "\[GDM\] Found installed GLEW" "glew came from the system package"
          gdm_forbid cfg-b-inst.log "\[GDM\] Fetching glew-cmake" "glew-cmake was not built (the system package was used)"
          # A dependency gdm downloads here is a defect in this job's contract,
          # not a fallback to shrug at: everything this platform packages must be
          # found by find_package. The blanket pattern covers glfw3, glm,
          # glew-cmake, cpptrace and anything gdm learns to fetch later; glutil's
          # header-only files print "[glutil] Fetching files ...", which this
          # pattern deliberately does not match, so the one documented exception
          # (the header-only libs) still passes - see the note below.
          gdm_forbid cfg-b-inst.log "\[GDM\] Fetching" "nothing was downloaded in the installed job"
          gdm_require cfg-b-inst.log "\[GDM\] Found installed cpptrace" "cpptrace came from the package"
          # glutil's header-only stb_image / tiny_obj_loader / dds-ktx are the one
          # documented exception: nothing packages them for a distro, so they are
          # fetched into external/ and then reported as "[glutil] Found external
          # files ..." there, which is why the patterns above are gdm's own tier
          # message and not the external/ one.
          gdm_forbid cfg-b-inst.log "\[GDM\] Found external glfw3" "no external/ glfw3 was used"
          gdm_build b-inst Release glutil gdm_example_1_HelloWindow

      # The one place a binary links against the system packages rather than
      # gdm's own static builds. It reports only: a runner's software GL is not
      # what this job is checking.
      # A failed run fails the job: the DLLs the example needs are staged next to it
      # by gdm_run (freeglut, any shared package library, and the Mesa llvmpipe
      # driver the step above installs), so a missing dependency here is a real
      # defect. Run on Linux and Windows for the same reason as the fetch job's.
      - name: run the example
        shell: bash
        run: |
          source .github/scripts/ci-common.sh
          gdm_run_example b-inst

      - name: re-configure (determinism)
        shell: bash
        run: |
          source .github/scripts/ci-common.sh
          gdm_configure b-inst2 Release -DGDM_GL_LOADER=glew $CPPTRACE_ARGS
          gdm_require cfg-b-inst2.log "\[GDM\] Found installed glfw3" "glfw came from the package"
          gdm_forbid cfg-b-inst2.log "\[GDM\] Found external glfw3" "no external/ glfw3 was used"
          # The same contract as the first configure: whatever gdm resolves the
          # second time must come from the packages too, not from the external/
          # copy the first configure may have left behind.
          gdm_forbid cfg-b-inst2.log "\[GDM\] Fetching" "nothing was downloaded on re-configure"
